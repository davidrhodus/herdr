name: Parser fuzzing

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parser-fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        target: [parser_chunking, parser_operations]
    env:
      FUZZ_TARGET: ${{ matrix.target }}
      FUZZ_RESULTS: fuzz/artifacts/ci-results
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: nightly

      - name: Install stable Rust for regression replay
        run: rustup toolchain install 1.96.1 --profile minimal

      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked

      - name: Restore evolving corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: parser-fuzz-corpus-v1-${{ matrix.target }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            parser-fuzz-corpus-v1-${{ matrix.target }}-${{ github.ref_name }}-

      - name: Record reproduction environment
        run: |
          cargo +nightly fetch --locked --manifest-path fuzz/Cargo.toml
          mkdir -p "$FUZZ_RESULTS"
          {
            git rev-parse HEAD
            rustc +nightly --version --verbose
            cargo +nightly fuzz --version
          } > "$FUZZ_RESULTS/environment.txt"

      - name: Fuzz for 30 minutes
        id: fuzz
        timeout-minutes: 35
        shell: bash
        run: |
          set -o pipefail
          cargo +nightly fuzz run "$FUZZ_TARGET" -- \
            -max_total_time=1800 -max_len=8192 -dict=fuzz/terminal.dict \
            -timeout=10 -rss_limit_mb=2048 2>&1 | tee "$FUZZ_RESULTS/fuzz.log"

      - name: Preserve failures as regression seeds
        if: always()
        run: |
          python3 scripts/fuzz_regressions.py "$FUZZ_TARGET" "fuzz/artifacts/$FUZZ_TARGET" --archive "$FUZZ_RESULTS"

      # Run after preservation, even when libFuzzer exits unsuccessfully. A
      # saved seed is automatically picked up by the normal Rust corpus test.
      - name: Replay regression seeds
        if: ${{ !cancelled() && steps.fuzz.outcome != 'skipped' }}
        shell: bash
        run: |
          set -o pipefail
          cargo +1.96.1 test --locked -p ghostty-vt parser_fuzz_seed_corpus_is_chunk_invariant -- --test-threads=1 \
            2>&1 | tee "$FUZZ_RESULTS/regression-replay.log"

      - name: Upload logs and regression tests
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: parser-fuzz-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FUZZ_RESULTS }}/
          if-no-files-found: error
          retention-days: 90

      - name: Save evolved corpus including regressions
        if: ${{ !cancelled() && steps.fuzz.outcome != 'skipped' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: parser-fuzz-corpus-v1-${{ matrix.target }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
